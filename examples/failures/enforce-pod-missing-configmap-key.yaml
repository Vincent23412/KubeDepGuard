apiVersion: v1
kind: ConfigMap
metadata:
  name: partial-config
data:
  present: value
---
apiVersion: v1
kind: Pod
metadata:
  name: enforce-pod-missing-configmap-key
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  containers:
    - name: app
      image: nginx:stable
      env:
        - name: REQUIRED
          valueFrom:
            configMapKeyRef:
              # 錯誤：ConfigMap 存在，但 missing key 不存在。
              name: partial-config
              key: missing
