apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enforce-ingress-missing-service
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  rules:
    - host: missing.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # 錯誤：backend Service 不存在。
                name: does-not-exist
                port:
                  number: 80
