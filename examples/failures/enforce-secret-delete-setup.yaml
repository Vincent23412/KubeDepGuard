apiVersion: v1
kind: Secret
metadata:
  name: protected-credentials
type: Opaque
stringData:
  token: keep-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enforce-secret-consumer
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  selector:
    matchLabels:
      app: enforce-secret-consumer
  template:
    metadata:
      labels:
        app: enforce-secret-consumer
    spec:
      containers:
        - name: app
          image: nginx:stable
          envFrom:
            - secretRef:
                # 刪除 protected-credentials 時會出錯：這個 enforce Deployment 仍引用它。
                # Webhook 會拒絕 `kubectl delete secret protected-credentials`。
                name: protected-credentials
