apiVersion: v1
kind: Secret
metadata:
  name: protected-credentials
type: Opaque
stringData:
  token: keep-me
---
apiVersion: v1
kind: Pod
metadata:
  name: enforce-secret-consumer
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  containers:
    - name: app
      image: nginx:stable
      envFrom:
        - secretRef:
            # 刪除 protected-credentials 時會出錯：這個 enforce Pod 仍引用它。
            # Webhook 會拒絕 `kubectl delete secret protected-credentials`。
            name: protected-credentials
