apiVersion: v1
kind: Pod
metadata:
  name: enforce-pod-missing-secret
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  containers:
    - name: app
      image: nginx:stable
      env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              # 錯誤：此 Secret 不存在，觸發 MissingSecret。
              # mode=enforce，因此 Admission Webhook 會拒絕整個 Pod 建立請求。
              name: does-not-exist
              key: token
