apiVersion: v1
kind: Service
metadata:
  name: protected-ingress-backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enforce-ingress-target
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  rules:
    - host: protected-ingress.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: protected-ingress-backend
                port:
                  number: 8080
