apiVersion: apps/v1
kind: Deployment
metadata:
  name: enforce-deployment-missing-secret
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  selector:
    matchLabels:
      app: missing-secret
  template:
    metadata:
      labels:
        app: missing-secret
    spec:
      containers:
        - name: app
          image: nginx:stable
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  # 此 Secret 不存在，觸發 MissingSecret。
                  name: does-not-exist
                  key: token
