apiVersion: v1
kind: Pod
metadata:
  name: enforce-networkpolicy-target
  labels:
    app: protected-network
spec:
  containers:
    - name: app
      image: nginx:stable
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enforce-networkpolicy-target
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  podSelector:
    matchLabels:
      app: protected-network
  policyTypes:
    - Ingress
