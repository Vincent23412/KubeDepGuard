apiVersion: v1
kind: Secret
metadata:
  name: partial-credentials
stringData:
  present: value
---
apiVersion: v1
kind: Pod
metadata:
  name: enforce-pod-missing-secret-key
  annotations:
    dependency.kubedepguard.io/mode: enforce
spec:
  containers:
    - name: app
      image: nginx:stable
      env:
        - name: REQUIRED
          valueFrom:
            secretKeyRef:
              # 錯誤：Secret 存在，但 missing key 不存在。
              name: partial-credentials
              key: missing
