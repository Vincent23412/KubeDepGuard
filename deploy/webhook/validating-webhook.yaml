apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-dep-guard
webhooks:
  - name: dependencies.kubedepguard.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-dep-guard-system", "kube-system"]
    clientConfig:
      service:
        namespace: kube-dep-guard-system
        name: kube-dep-guard-webhook
        path: /validate/dependencies
        port: 443
      caBundle: ""
    rules:
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "configmaps", "secrets", "services"]
        scope: "Namespaced"
