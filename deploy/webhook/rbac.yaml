apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-dep-guard-webhook
  namespace: kube-dep-guard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-dep-guard-webhook
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-dep-guard-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-dep-guard-webhook
subjects:
  - kind: ServiceAccount
    name: kube-dep-guard-webhook
    namespace: kube-dep-guard-system
