apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-dep-guard-monitor
  namespace: kube-dep-guard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-dep-guard-monitor
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-dep-guard-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-dep-guard-monitor
subjects:
  - kind: ServiceAccount
    name: kube-dep-guard-monitor
    namespace: kube-dep-guard-system
