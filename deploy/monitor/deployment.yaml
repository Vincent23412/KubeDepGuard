apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-dep-guard-monitor
  namespace: kube-dep-guard-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/component: monitor
    spec:
      serviceAccountName: kube-dep-guard-monitor
      containers:
        - name: monitor
          image: kube-dep-guard-monitor:dev
          imagePullPolicy: IfNotPresent
          args: ["--workers=2"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
